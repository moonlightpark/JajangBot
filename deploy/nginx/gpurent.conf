# www.gpurent.io -> dashboard (Next, 127.0.0.1:3001)
# api.gpurent.io -> bot API and SSE (Bun, 127.0.0.1:3000)
# setup-server.sh copies this to /etc/nginx/sites-available once, then certbot adds the
# 443 blocks in place. deploy.sh does not touch it, so certbot's edits stay.

server {
    listen 80;
    listen [::]:80;
    server_name gpurent.io;
    return 301 https://www.gpurent.io$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.gpurent.io;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gpurent.io;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # /events is SSE: stream each event as it comes and keep the connection open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
